[project]
name = "image-classifier"
version = "0.1.0"
description = "CIFAR-10 image classification with a PyTorch CNN and an in-browser demo"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "PL"]
# PLR0913: model and training functions legitimately take many hyperparameters
# PLW2901: rebinding the batch in "images = images.to(device)" is the standard PyTorch loop pattern
# E501: long lines are only explanatory comments and docstrings; code stays under the limit
ignore = ["PLR0913", "PLW2901", "E501"]
